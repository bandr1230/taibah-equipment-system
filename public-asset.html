<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جامعة طيبة - بطاقة أصل</title>
  <style>
    :root{
      --green:#0a8e6e;--blue:#4056e3;--turquoise:#00aeda;--navy:#111144;
      --bg:#f2f2f2;--text:#111144;--muted:#62687c;--border:#dde3ef;--white:#fff;
      --shadow:0 14px 34px rgba(17,17,68,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .page{width:min(920px,100%);margin:0 auto;padding:18px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--white);border:1px solid var(--border);border-top:5px solid var(--green);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:58px;height:58px;object-fit:contain}
    h1{font-size:21px;margin:0 0 4px;color:var(--navy)}
    .sub{font-size:13px;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:900;background:#e8f8f2;color:#08745a;border:1px solid #bfe8d8;white-space:nowrap}
    .badge.warn{background:#fff7d8;color:#816400;border-color:#ead889}
    .badge.bad{background:#ffe3e3;color:#9c3030;border-color:#ffc4c4}
    .card{background:var(--white);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
    .title{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{border:1px solid #e7edf6;border-radius:14px;padding:12px;background:#fbfdff}
    .label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .value{font-size:15px;font-weight:800;line-height:1.7;word-break:break-word}
    .empty{padding:26px;text-align:center;color:var(--muted)}
    .footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;padding:10px}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900}
    @media(max-width:680px){
      .page{padding:12px}
      .header{align-items:flex-start;flex-direction:column}
      .grid{grid-template-columns:1fr}
      h1{font-size:19px}
      .logo{width:50px;height:50px}
    }
  </style>
</head>
<body>
  <div id="public-root" class="loading">جاري تحميل بيانات الأصل...</div>
  <script src="supabase-config.js?v=20260427-remote-test"></script>
  <script src="data.js?v=demo-20260423"></script>
  <script src="public-asset.js?v=20260429-device-only-2"></script>
</body>
</html>
